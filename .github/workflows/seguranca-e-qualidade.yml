name: Segurança e qualidade

# Gerado pelo bootstrap/aplicar-em-todos.sh a partir de ElkysOfficial/ci-templates.
# Editar à mão é perder a alteração na próxima passada: mude o padrão lá.
# A lógica dos gates mora nos reutilizáveis; aqui só ficam os apontamentos.
# Push na branch padrao continua: e a rede de seguranca quando o merge e feito com bypass e pega
# vulnerabilidade nova da base dos scanners. Varredura semanal de madrugada (01:17 em Brasilia).
on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-node:
    uses: ElkysOfficial/ci-templates/.github/workflows/_reusable-ci-node.yml@main
    with:
      working-directory: "."
      com-lockfile: true
      run-lint: true
      run-test: false
      test-script: "test"
      run-build: true